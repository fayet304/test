<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Absensi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; color: #38bdf8; letter-spacing: 0.5px; }
    
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card-stat { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; }
    .card-stat p { font-size: 0.85rem; color: #94a3b8; }
    .card-stat h2 { font-size: 2rem; margin-top: 8px; }
    
    .table-container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #38bdf8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; background: #065f46; color: #34d399; }
  </style>
</head>
<body>

<div class="header">
  <h1>MONITORING ABSENSI REAL-TIME</h1>
  <div id="sync-status" style="font-size: 0.85rem; color: #10b981; font-weight: 600;">● Live Syncing...</div>
</div>

<div class="grid-stats">
  <div class="card-stat"><p>Total Karyawan</p><h2 id="st-total">0</h2></div>
  <div class="card-stat"><p>Hadir Hari Ini</p><h2 id="st-hadir" style="color:#34d399">0</h2></div>
  <div class="card-stat"><p>Izin Keluar</p><h2 id="st-izin" style="color:#facc15">0</h2></div>
  <div class="card-stat"><p>Sudah Pulang</p><h2 id="st-pulang" style="color:#60a5fa">0</h2></div>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>ID Karyawan</th>
        <th>Nama</th>
        <th>Jam Masuk</th>
        <th>Log Izin</th>
        <th>Jam Pulang</th>
      </tr>
    </thead>
    <tbody id="log-table">
      <tr><td colspan="5" style="text-align:center; padding: 20px; color: #94a3b8;">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // PASTE URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
  const URL = "https://script.google.com/macros/s/AKfycbyZd7J5SqvXa0SDy8Nirb1ENWGBApyagGuklEc_lQGm_kb2BiAdEGhMeEppv9PgHcJ8lA/exec";

  function fetchDashboard() {
    const statusEl = document.getElementById('sync-status');
    
    fetch(URL)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        statusEl.innerText = "⚠️ Error: " + data.error;
        statusEl.style.color = "#f87171";
        return;
      }

      statusEl.innerText = "● Live Syncing...";
      statusEl.style.color = "#10b981";

      document.getElementById('st-total').innerText = data.totalKaryawan || 0;
      document.getElementById('st-hadir').innerText = data.hadir || 0;
      document.getElementById('st-izin').innerText = data.izin || 0;
      document.getElementById('st-pulang').innerText = data.pulang || 0;

      let tbody = document.getElementById('log-table');
      if (!data.logs || data.logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 20px;">Belum ada aktivitas absensi untuk hari ini</td></tr>`;
        return;
      }

      let html = '';
      data.logs.forEach(row => {
        html += `
          <tr>
            <td><b>${row.id}</b></td>
            <td>${row.nama}</td>
            <td><span class="badge">${row.masuk}</span></td>
            <td>${row.izin}</td>
            <td>${row.pulang}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    })
    .catch(err => {
      statusEl.innerText = "❌ Gagal Terhubung ke Script";
      statusEl.style.color = "#f87171";
    });
  }

  // Refresh otomatis setiap 5 detik
  setInterval(fetchDashboard, 5000);
  fetchDashboard();
</script>

</body>
</html>
