<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Multi-Payment POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- LOGIN CONTAINER -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">System Kasir POS</h1>
        <p class="text-sm text-gray-500">Silakan login untuk mengakses sistem</p>
      </div>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">Username</label>
          <input type="text" id="login-username" required class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">Password</label>
          <input type="password" id="login-password" required class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col md:flex-row">
    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center">
        <span class="font-bold text-lg tracking-wide text-blue-400">ADMIN POS</span>
        <span id="user-display" class="text-xs bg-slate-800 px-2 py-1 rounded"></span>
      </div>
      <nav class="p-4 space-y-1 text-sm">
        <a href="#dashboard" onclick="navigate('dashboard')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-chart-line w-5"></i> Dashboard</a>
        <a href="#deposit" onclick="navigate('deposit')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-arrow-down w-5 text-green-400"></i> Transaksi Deposit</a>
        <a href="#withdraw" onclick="navigate('withdraw')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-arrow-up w-5 text-red-400"></i> Transaksi Withdraw</a>
        <a href="#banklist" onclick="navigate('banklist')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-university w-5"></i> Kelola Bank List</a>
        <a href="#users" onclick="navigate('users')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-users w-5"></i> Pengaturan Kasir / IP</a>
        <a href="#history" onclick="navigate('history')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-history w-5"></i> Histori Transaksi</a>
        <a href="#logs" onclick="navigate('logs')" class="nav-item flex items-center gap-3 px-4 py-3 rounded hover:bg-slate-800 transition"><i class="fa fa-shield-alt w-5"></i> Activity Logs</a>
        <button onclick="handleLogout()" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded hover:bg-red-900/50 text-red-400 transition mt-6"><i class="fa fa-sign-out-alt w-5"></i> Logout</button>
      </nav>
    </aside>

    <!-- CONTENT AREA -->
    <main class="flex-1 p-6 overflow-y-auto">
      <div id="content-area"></div>
    </main>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbxzSU69pzu3ASE7mExw4BTWqg9vd2bR--D7aOJ32XxGfdVgEi2CCHaTvRq6Jo0WDfO0/exec";

    let currentUser = null;
    let bankCache = [];

    // AUTO SESSION ON LOAD (ANTI LOGOUT AFTER REFRESH)
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("pos_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showApp();
      } else {
        showLogin();
      }
    });

    async function apiCall(action, data = {}) {
      data.action = action;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });
        return await res.json();
      } catch (err) {
        alert("Gagal terhubung ke server API Google Sheets.");
        return { success: false };
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-username").value;
      const p = document.getElementById("login-password").value;
      
      const res = await apiCall("login", { username: u, password: p });
      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("pos_user", JSON.stringify(currentUser));
        showApp();
      } else {
        alert(res.message);
      }
    }

    function handleLogout() {
      localStorage.removeItem("pos_user");
      currentUser = null;
      showLogin();
    }

    function showLogin() {
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("app-screen").classList.add("hidden");
    }

    function showApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("user-display").innerText = `${currentUser.nama} (${currentUser.role})`;
      
      const hash = window.location.hash.replace("#", "") || "dashboard";
      navigate(hash);
    }

    function navigate(route) {
      window.location.hash = route;
      const area = document.getElementById("content-area");
      
      if (route === "dashboard") renderDashboard(area);
      else if (route === "deposit") renderTransactionForm(area, "DEPOSIT");
      else if (route === "withdraw") renderTransactionForm(area, "WITHDRAW");
      else if (route === "banklist") renderBankList(area);
      else if (route === "users") renderUsers(area);
      else if (route === "history") renderHistory(area);
      else if (route === "logs") renderLogs(area);
    }

    // --- VIEW RENDERERS ---

    async function renderDashboard(area) {
      area.innerHTML = `<h2 class="text-2xl font-bold mb-4">Dashboard System</h2><div class="text-gray-500">Memuat data...</div>`;
      const res = await apiCall("getDashboardData");
      if (!res.success) return;

      area.innerHTML = `
        <h2 class="text-2xl font-bold mb-6">Dashboard Summary</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
            <div class="text-sm font-semibold text-gray-500">Transaksi Hari Ini</div>
            <div class="text-3xl font-bold mt-2">${res.stats.today}</div>
          </div>
          <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
            <div class="text-sm font-semibold text-gray-500">Transaksi Minggu Ini</div>
            <div class="text-3xl font-bold mt-2">${res.stats.week}</div>
          </div>
          <div class="bg-white p-6 rounded-xl shadow border-l-4 border-purple-500">
            <div class="text-sm font-semibold text-gray-500">Transaksi Bulan Ini</div>
            <div class="text-3xl font-bold mt-2">${res.stats.month}</div>
          </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow">
          <h3 class="text-lg font-bold mb-4">Daftar Admin Kasir Terdaftar</h3>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-gray-50">
                <th class="p-3">User ID</th>
                <th class="p-3">Nama</th>
                <th class="p-3">Role</th>
                <th class="p-3">IP Whitelist</th>
              </tr>
            </thead>
            <tbody>
              ${res.users.map(u => `
                <tr class="border-b">
                  <td class="p-3 font-mono">${u.id}</td>
                  <td class="p-3 font-semibold">${u.nama}</td>
                  <td class="p-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">${u.role}</span></td>
                  <td class="p-3 text-sm text-gray-600">${u.allowed_ips}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderTransactionForm(area, type) {
      area.innerHTML = `<div class="text-gray-500">Memuat form...</div>`;
      const bRes = await apiCall("getBankList");
      bankCache = bRes.data || [];

      area.innerHTML = `
        <h2 class="text-2xl font-bold mb-6">Form ${type}</h2>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="bg-white p-6 rounded-xl shadow lg:col-span-1">
            <form onsubmit="submitTransaction(event, '${type}')" class="space-y-4">
              <div>
                <label class="block text-sm font-semibold">Pilih Bank / E-Wallet</label>
                <select id="trx-bank" onchange="updateBankSaldo()" required class="w-full mt-1 p-3 border rounded-lg">
                  <option value="">-- Pilih --</option>
                  ${bankCache.map(b => `<option value="${b.bank_id}">${b.nama_bank} - ${b.no_rekening}</option>`).join('')}
                </select>
              </div>
              
              <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                <div class="text-xs text-blue-600 font-bold">SALDO SAAT INI</div>
                <div id="display-saldo" class="text-xl font-extrabold text-blue-900">Rp 0</div>
              </div>

              <div>
                <label class="block text-sm font-semibold">User ID Pelanggan</label>
                <input type="text" id="trx-userid" required class="w-full mt-1 p-2 border rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold">Nama Rekening / Pengirim</label>
                <input type="text" id="trx-nama" required class="w-full mt-1 p-2 border rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold">Nominal Transaksi</label>
                <input type="number" id="trx-nominal" required class="w-full mt-1 p-2 border rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold">Admin Fee</label>
                <input type="number" id="trx-fee" value="0" class="w-full mt-1 p-2 border rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold">Bank Penampung / Kas (Opsional)</label>
                <select id="trx-penampung" class="w-full mt-1 p-2 border rounded-lg">
                  <option value="-">Tanpa Pindah Saldo</option>
                  ${bankCache.map(b => `<option value="${b.nama_bank}">${b.nama_bank}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold">Status Transaksi</label>
                <select id="trx-status" class="w-full mt-1 p-2 border rounded-lg">
                  <option value="SUCCESS">SUCCESS</option>
                  <option value="PENDING">PENDING</option>
                </select>
              </div>
              <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">SIMPAN TRANSAKSI</button>
            </form>
          </div>

          <div class="bg-white p-6 rounded-xl shadow lg:col-span-2">
            <h3 class="text-lg font-bold mb-4">Histori Transaksi Bank Terpilih</h3>
            <div id="bank-history-table" class="text-sm text-gray-500">Pilih bank untuk melihat histori mutasi saldo.</div>
          </div>
        </div>
      `;
    }

    function updateBankSaldo() {
      const bankId = document.getElementById("trx-bank").value;
      const b = bankCache.find(item => String(item.bank_id) === String(bankId));
      if (b) {
        document.getElementById("display-saldo").innerText = `Rp ${Number(b.saldo_terakhir).toLocaleString()}`;
        loadBankHistory(bankId);
      } else {
        document.getElementById("display-saldo").innerText = "Rp 0";
      }
    }

    async function loadBankHistory(bankId) {
      const target = document.getElementById("bank-history-table");
      target.innerHTML = "Memuat mutasi...";
      const res = await apiCall("getTransactions", { bank_id: bankId });
      
      if (res.data.length === 0) {
        target.innerHTML = "Belum ada transaksi di bank ini.";
        return;
      }

      target.innerHTML = `
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50">
              <th class="p-2">User ID</th>
              <th class="p-2">Pengirim</th>
              <th class="p-2">Nominal</th>
              <th class="p-2">Saldo Awal $\rightarrow$ Saldo Akhir</th>
              <th class="p-2">Admin</th>
            </tr>
          </thead>
          <tbody>
            ${res.data.map(t => `
              <tr class="border-b">
                <td class="p-2 font-mono">${t.user_id}</td>
                <td class="p-2">${t.nama_rekening}</td>
                <td class="p-2 font-bold ${t.type === 'DEPOSIT' ? 'text-green-600' : 'text-red-600'}">Rp ${Number(t.nominal).toLocaleString()}</td>
                <td class="p-2 text-xs">Rp ${Number(t.saldo_awal).toLocaleString()} $\rightarrow$ <br><b>Rp ${Number(t.saldo_akhir).toLocaleString()}</b></td>
                <td class="p-2">${t.admin_processor}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function submitTransaction(e, type) {
      e.preventDefault();
      const payload = {
        type: type,
        bank_id: document.getElementById("trx-bank").value,
        user_id: document.getElementById("trx-userid").value,
        nama_rekening: document.getElementById("trx-nama").value,
        nominal: document.getElementById("trx-nominal").value,
        admin_fee: document.getElementById("trx-fee").value,
        bank_penampung: document.getElementById("trx-penampung").value,
        status: document.getElementById("trx-status").value,
        admin_processor: currentUser.username
      };

      const res = await apiCall("processTransaction", payload);
      if (res.success) {
        alert(res.message);
        navigate(type.toLowerCase());
      } else {
        alert("Gagal: " + res.message);
      }
    }

    async function renderHistory(area) {
      area.innerHTML = `
        <h2 class="text-2xl font-bold mb-4">Semua Histori Transaksi</h2>
        <div class="bg-white p-4 rounded-xl shadow mb-4 flex gap-4">
          <input type="text" id="search-input" placeholder="Cari ID, Nama, atau Admin..." class="p-2 border rounded flex-1">
          <button onclick="fetchHistoryFilter()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">CARI</button>
        </div>
        <div id="history-container" class="bg-white p-6 rounded-xl shadow">Memuat...</div>
      `;
      fetchHistoryFilter();
    }

    async function fetchHistoryFilter() {
      const s = document.getElementById("search-input").value;
      const target = document.getElementById("history-container");
      const res = await apiCall("getTransactions", { search: s });

      target.innerHTML = `
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50">
              <th class="p-3">Trx ID</th>
              <th class="p-3">Tipe</th>
              <th class="p-3">User ID</th>
              <th class="p-3">Nama Rekening</th>
              <th class="p-3">Nominal</th>
              <th class="p-3">Status</th>
              <th class="p-3">Admin</th>
              <th class="p-3">Waktu</th>
            </tr>
          </thead>
          <tbody>
            ${res.data.map(t => `
              <tr class="border-b">
                <td class="p-3 font-mono text-xs">${t.trx_id}</td>
                <td class="p-3 font-bold ${t.type === 'DEPOSIT' ? 'text-green-600' : 'text-red-600'}">${t.type}</td>
                <td class="p-3 font-mono">${t.user_id}</td>
                <td class="p-3">${t.nama_rekening}</td>
                <td class="p-3 font-semibold">Rp ${Number(t.nominal).toLocaleString()}</td>
                <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${t.status === 'SUCCESS' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${t.status}</span></td>
                <td class="p-3">${t.admin_processor}</td>
                <td class="p-3 text-xs text-gray-500">${new Date(t.created_at).toLocaleString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function renderBankList(area) {
      area.innerHTML = `<div class="text-gray-500">Memuat Bank...</div>`;
      const res = await apiCall("getBankList");

      area.innerHTML = `
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Kelola Bank List</h2>
          <button onclick="showAddBankModal()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">+ Tambah Bank</button>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-gray-50">
                <th class="p-3">ID Bank</th>
                <th class="p-3">Nama Bank / E-Wallet</th>
                <th class="p-3">No Rekening</th>
                <th class="p-3">Nama Pemilik</th>
                <th class="p-3">Saldo Saat Ini</th>
              </tr>
            </thead>
            <tbody>
              ${res.data.map(b => `
                <tr class="border-b">
                  <td class="p-3 font-mono">${b.bank_id}</td>
                  <td class="p-3 font-bold">${b.nama_bank}</td>
                  <td class="p-3 font-mono">${b.no_rekening}</td>
                  <td class="p-3">${b.nama_pemilik}</td>
                  <td class="p-3 font-extrabold text-blue-700">Rp ${Number(b.saldo_terakhir).toLocaleString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function showAddBankModal() {
      const nama = prompt("Masukkan Nama Bank / E-Wallet (misal: BCA, OVO):");
      if (!nama) return;
      const norek = prompt("Masukkan Nomor Rekening:");
      const pemilik = prompt("Masukkan Nama Pemilik Rekening:");
      const saldo = prompt("Masukkan Saldo Awal (Rp):", "0");

      await apiCall("saveBank", { nama_bank: nama, no_rekening: norek, nama_pemilik: pemilik, saldo_terakhir: saldo });
      alert("Bank berhasil ditambahkan!");
      navigate("banklist");
    }

    async function renderUsers(area) {
      area.innerHTML = `<div class="text-gray-500">Memuat User...</div>`;
      const res = await apiCall("getUsers");

      area.innerHTML = `
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Pengaturan Admin Kasir & Whitelist IP</h2>
          <button onclick="showAddUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">+ Tambah Kasir</button>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b bg-gray-50">
                <th class="p-3">ID Kasi
