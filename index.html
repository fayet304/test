<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kios Scanner Absensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { width: 100%; max-width: 420px; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #38bdf8; margin-bottom: 4px; font-size: 1.4rem; }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
    .mode-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-mode { flex: 1; padding: 12px 6px; border: none; border-radius: 10px; font-weight: bold; font-size: 0.85rem; color: #fff; cursor: pointer; opacity: 0.4; transition: 0.2s; background: #334155; }
    .btn-mode.active { opacity: 1; transform: scale(1.02); }
    .btn-masuk.active { background: #059669; }
    .btn-izin.active { background: #d97706; }
    .btn-pulang.active { background: #2563eb; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #334155; background: #000; }
    #status-box { margin-top: 16px; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; display: none; }
    .status-masuk { background-color: #065f46; color: #34d399; border: 1px solid #059669; }
    .status-izin { background-color: #78350f; color: #fde047; border: 1px solid #d97706; }
    .status-pulang { background-color: #1e40af; color: #60a5fa; border: 1px solid #2563eb; }
    .status-error { background-color: #991b1b; color: #f87171; border: 1px solid #dc2626; }
    .loading { color: #38bdf8; font-size: 0.9rem; margin-top: 12px; display: none; font-weight: 600; }
  </style>
</head>
<body>

<div class="card">
  <h2>KIOS ABSENSI</h2>
  <p class="subtitle">Pilih jenis absen, lalu scan barcode ID Card</p>

  <div class="mode-group">
    <button id="btn-MASUK" class="btn-mode btn-masuk active" onclick="setMode('MASUK')">MASUK</button>
    <button id="btn-IZIN" class="btn-mode btn-izin" onclick="setMode('IZIN')">IZIN</button>
    <button id="btn-PULANG" class="btn-mode btn-pulang" onclick="setMode('PULANG')">PULANG</button>
  </div>

  <div id="reader"></div>
  <div id="loading" class="loading">Memproses data...</div>
  <div id="status-box"></div>
</div>

<script>
  // PASTE URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA";

  let currentMode = "MASUK";
  let isScanningAllowed = true;

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${mode}`).classList.add('active');
  }

  function onScanSuccess(decodedText) {
    if (!isScanningAllowed) return;

    isScanningAllowed = false;
    showLoading(true);
    hideStatus();

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ idCard: decodedText, mode: currentMode })
    })
    .then(res => res.json())
    .then(data => {
      showLoading(false);
      if (data.status === "success") {
        let cls = "status-masuk";
        if (data.type === "IZIN") cls = "status-izin";
        if (data.type === "PULANG") cls = "status-pulang";

        showStatus(`[${data.type}] ${data.nama}<br>${data.message} (${data.time})`, cls);
      } else {
        showStatus("Gagal: " + data.message, "status-error");
      }

      setTimeout(() => {
        isScanningAllowed = true;
        hideStatus();
      }, 3000);
    })
    .catch(err => {
      showLoading(false);
      showStatus("Kesalahan koneksi internet!", "status-error");
      setTimeout(() => { isScanningAllowed = true; hideStatus(); }, 3000);
    });
  }

  function showLoading(show) {
    document.getElementById("loading").style.display = show ? "block" : "none";
  }

  function showStatus(text, className) {
    const box = document.getElementById("status-box");
    box.innerHTML = text;
    box.className = className;
    box.style.display = "block";
  }

  function hideStatus() {
    document.getElementById("status-box").style.display = "none";
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 }, false);
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
